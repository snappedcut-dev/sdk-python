name: Release

# Publishing happens here and nowhere else. `id-token: write` is what lets PyPI
# accept the upload through trusted publishing and attach a signed attestation —
# a public link from the wheel back to this commit and this workflow run. A
# publish from a laptop cannot produce one, which is the point.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      # The tag is the source of truth: v1.2.3 must be version 1.2.3, or the
      # wheel on PyPI and the tag in git disagree forever.
      - name: The tag must match the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != pyproject $pkg"; exit 1; }
      - run: pip install build==1.2.2.post1
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # An API token until a trusted publisher is registered on PyPI; then drop
      # the password and turn attestations back on (they need OIDC).
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
