[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snappedcut"
version = "0.1.0"
description = "Python SDK for the Snapped Cut cloud render API (standard library only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Illuminati Networks" }]
keywords = ["snappedcut", "video", "render", "webcodecs", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
# No dependencies, and that is the point: this installs into a locked-down CI
# image or a Lambda without pulling a tree behind it.
dependencies = []

[project.urls]
Homepage = "https://snappedcut.com"
Documentation = "https://snappedcut.com/docs"
Source = "https://github.com/snappedcut-dev/sdk-python"
Issues = "https://github.com/snappedcut-dev/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snappedcut"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
